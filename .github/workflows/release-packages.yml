name: Build Release Packages

# Builds the macOS app (Go + myGo) and, for a v* tag, publishes it as a GitHub release:
#   popMind-<version>.pkg            installs over /Applications/popMind.app (quits it, relaunches)
#   popMind <version> arm64.dmg      drag to Applications (background with an arrow, made by dmgbuild)
#   popMind-<version>-mac-arm64.zip
#   popmind-<version>-darwin-arm64.tar.gz, deltas, update-darwin-arm64.json   in-app updates (myGo's updater)
#   popMind-<version>-windows-x64-setup.exe, popMind-windows-x64-setup.exe     Windows installer (NSIS)
#   popmind-<version>-windows-amd64.tar.gz, deltas, update-windows-amd64.json  Windows in-app updates
#
# Signing: the self-signed "popMind Self Signed" certificate (secrets MAC_SELF_SIGN_P12_BASE64 and
# MAC_SELF_SIGN_P12_PASSWORD, made once by archive/electron/scripts/create-mac-signing-cert.sh) is the one the
# Electron releases were signed with, so the app's designated requirement stays the same and users keep their
# Accessibility / Screen Recording grants across the update.
#
# In-app updates: MYGO_UPDATER_PRIVATE_KEY (the secret of the key whose public half is updates.publicKey in
# mygo.json) signs them; installed apps read update-darwin-arm64.json from the latest release.

on:
  workflow_dispatch:
    inputs:
      allow_unsigned_mac:
        description: Build an ad-hoc signed package when the signing secrets are unavailable (testing only)
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest
    env:
      MAC_SELF_SIGN_P12_BASE64: ${{ secrets.MAC_SELF_SIGN_P12_BASE64 }}
      MAC_SELF_SIGN_P12_PASSWORD: ${{ secrets.MAC_SELF_SIGN_P12_PASSWORD }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mygo.json version $version" >&2
            exit 1
          fi

      - name: Check the update signing key
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A release without signed updates would leave the apps that install it unable to update.
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY:-}" ]; then
            echo "Missing MYGO_UPDATER_PRIVATE_KEY: releases must carry signed updates." >&2
            exit 1
          fi

      - name: Resolve signing mode
        id: signing_mode
        env:
          ALLOW_UNSIGNED_MAC: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_mac || 'false' }}
        run: |
          if [ -n "${MAC_SELF_SIGN_P12_BASE64:-}" ] && [ -n "${MAC_SELF_SIGN_P12_PASSWORD:-}" ]; then
            echo "mode=self-signed" >> "$GITHUB_OUTPUT"
            echo "Using the self-signed popMind certificate."
            exit 0
          fi
          if [ "${ALLOW_UNSIGNED_MAC}" = "true" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are missing. Building an ad-hoc signed package for testing only."
            exit 0
          fi
          echo "Missing MAC_SELF_SIGN_P12_BASE64 / MAC_SELF_SIGN_P12_PASSWORD." >&2
          exit 1

      - name: Import self-signed certificate
        if: steps.signing_mode.outputs.mode == 'self-signed'
        run: |
          KEYCHAIN="$RUNNER_TEMP/popmind-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MAC_SELF_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/popmind-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/popmind-signing.p12" -k "$KEYCHAIN" -P "$MAC_SELF_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # codesign finds untrusted (self-signed) identities only by hash, and only in keychains on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/popmind-signing.p12"
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/popMind Self Signed/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "Self-signed identity not found in keychain" >&2
            exit 1
          fi
          echo "POPMIND_MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build packages
        run: ./scripts/package-mac.sh

      - name: Build Windows packages
        run: |
          brew install makensis
          ./scripts/package-windows.sh

      - name: Verify the signature keeps users' permissions
        if: steps.signing_mode.outputs.mode == 'self-signed'
        run: |
          APP=build/darwin-arm64/popMind.app
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -d -r- "$APP" 2>&1 | tee /tmp/popmind-app-requirement.txt
          # A stable designated requirement is what keeps permissions across updates.
          grep -q 'identifier "com.popmind.app" and certificate leaf = H"' /tmp/popmind-app-requirement.txt
          codesign -d --entitlements :- "$APP/Contents/MacOS/popMind" 2>&1 | grep 'com.apple.security.cs.disable-library-validation'

      - name: Warn about an ad-hoc package
        if: steps.signing_mode.outputs.mode == 'unsigned'
        run: |
          echo "Ad-hoc signed package built: for local testing only."
          echo "Installing it makes macOS ask for Accessibility / Screen Recording permission again."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.signing_mode.outputs.mode == 'unsigned' && 'popmind-macos-unsigned' || 'popmind-macos' }}
          if-no-files-found: error
          path: |
            build/*.pkg
            build/*.dmg
            build/*.zip
            build/darwin-arm64/*.tar.gz
            build/darwin-arm64/*.delta
            build/darwin-arm64/update-*.json
            build/*windows-x64-setup.exe
            build/windows-amd64/*.tar.gz
            build/windows-amd64/*.delta
            build/windows-amd64/update-*.json

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifacts keep build/'s folders (the update files are in darwin-arm64/): upload the files.
          mapfile -t files < <(find release-artifacts -type f | sort)
          printf '%s\n' "${files[@]}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --generate-notes --verify-tag
          fi
