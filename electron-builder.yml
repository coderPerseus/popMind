appId: com.popmind.app
productName: popMind
asar: true
asarUnpack:
  - resources/**
  - build/Release/*.node
directories:
  buildResources: resources/build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: popMind
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - pkg
    - zip
  # Accessibility/TCC permissions are matched against the app's signing
  # identity; ad-hoc builds look like a new app after every update. The custom
  # hook signs with a stable certificate so grants survive updates.
  sign: scripts/mac-sign.cjs
  entitlements: resources/build/entitlements.mac.plist
  entitlementsInherit: resources/build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
pkg:
  artifactName: ${name}-${version}.${ext}
  installLocation: /Applications
  # Always install to /Applications/popMind.app and replace the existing copy.
  # With relocation enabled the installer follows any other bundle that has the
  # same id (e.g. an unzipped "popMind 2.app" in Downloads) and installs there.
  isRelocatable: false
  overwriteAction: upgrade
  # preinstall quits a running popMind, postinstall removes duplicate copies and relaunches it
  scripts: pkg-scripts
  allowAnywhere: false
  allowCurrentUserHome: false
  allowRootDirectory: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
